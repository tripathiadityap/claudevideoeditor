name: Sync Pinterest

on:
  schedule:
    - cron: "43 19 * * *"   # 1:13 AM IST, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-pinterest.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- pinterest.json; then echo "No new pins"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinterest.json
          git commit -m "Sync Pinterest board"
          git push
